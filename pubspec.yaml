name: image_picker_plus
description: Image and video picker with gallery, camera, crop, filters, themes and optional caching, on mobile, web and desktop. No native code of its own.
version: 1.0.1
homepage: https://github.com/AhmedAbdoElhawary/image_picker_plus
repository: https://github.com/AhmedAbdoElhawary/image_picker_plus
issue_tracker: https://github.com/AhmedAbdoElhawary/image_picker_plus/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# the camera and gallery plugins don't declare desktop, so pub.dev can't work it out on its own
platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.12.0
  camera: ^0.12.1
  image: ^4.10.1
  video_player: ^2.14.0
  file_selector: ^1.1.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
