name: image_picker_plus
description: Image and video picker with gallery, camera, crop, filters, themes and optional caching. No native code of its own.
version: 1.0.0
homepage: https://github.com/AhmedAbdoElhawary/image_picker_plus.git

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.12.0
  camera: ^0.12.1
  image: ^4.10.1
  video_player: ^2.14.0
  cross_file: ^0.3.5+5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
