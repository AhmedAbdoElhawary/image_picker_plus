name: image_picker_plus
description: Customization of the gallery display or even camera and video.
version: 0.6.0
homepage: https://github.com/AhmedAbdoElhawary/image_picker_plus.git

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.12.0
  shimmer: ^4.0.0
  camera: ^0.12.1
  image: ^4.10.1
  video_player: ^2.14.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.lykhonis.imagecrop
        pluginClass: ImageCropPlugin
      ios:
        pluginClass: ImageCropPlugin
