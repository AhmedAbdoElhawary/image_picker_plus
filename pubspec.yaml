name: image_picker_plus
description: Image and video picker with gallery, camera, crop, filters, themes and optional caching, on mobile, web and desktop. No native code of its own.
version: 2.0.0
homepage: https://github.com/AhmedAbdoElhawary/image_picker_plus
repository: https://github.com/AhmedAbdoElhawary/image_picker_plus
issue_tracker: https://github.com/AhmedAbdoElhawary/image_picker_plus/issues

topics:
  - image-picker
  - gallery
  - camera
  - image-editing
  - crop

# pub.dev only shows screenshots that are in the package, .pubignore lets these 4 in
screenshots:
  - description: The gallery with the crop preview and the ratio menu.
    path: snapshots/gallery.jpg
  - description: Cropping in the preview with multi selection, in the light theme.
    path: snapshots/crop.jpg
  - description: The camera with photo and video tabs.
    path: snapshots/camera.jpg
  - description: The edit screen on macOS and the web.
    path: snapshots/web.png

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# the camera and gallery plugins don't declare desktop, so pub.dev can't work it out on its own
platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.12.0
  camera: ^0.12.1
  video_player: ^2.14.1
  file_selector: ^1.1.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  image: ^4.10.1

  flutter_lints: ^6.0.0
